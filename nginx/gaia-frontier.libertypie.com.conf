# =============================================================================
# libertypie.com — YouTube Playable Gateway (Certbot-Ready)
# Path: /etc/nginx/sites-available/gaia-frontier.libertypie.com.conf
# =============================================================================

# ─── HTTP-Level Mappings & Zones ───────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $upstream_http_content_type $html_cache_control {
    default "";
    "~text/html"         "no-cache, must-revalidate";
    "~application/xhtml" "no-cache, must-revalidate";
}

log_format app_log_fmt '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent rt=$request_time '
                     'uct=$upstream_connect_time urt=$upstream_response_time '
                     'ua="$http_user_agent"';

upstream app_upstream {
    server 127.0.0.1:33400 max_fails=3 fail_timeout=10s;
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

# ─── Server Block (HTTP Port 80) ───────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name gaia-frontier.libertypie.com;

    # Certbot ACME Challenge Webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Logging & Body Limits
    access_log /var/log/nginx/gaia_frontier.libertypie.com_access.log app_log_fmt buffer=32k flush=5s;
    error_log /var/log/nginx/gaia_frontier.libertypie.com_error.log warn;
    client_max_body_size 25m;

    # ─── YouTube Playable Security & CORS Headers ────────────────
    # 1. ALLOW IFRAME EMBEDDING: Replaced X-Frame-Options with frame-ancestors *
    # 2. CORS & CORP: Allows YouTube sandbox to fetch WASM, audio, and asset bundles
    add_header Content-Security-Policy "frame-ancestors *;" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Dynamic Brotli & Gzip Compression
    brotli on;
    brotli_comp_level 5;
    brotli_static on;
    brotli_types text/plain text/css application/json application/javascript application/wasm image/svg+xml audio/wav;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css text/plain application/json application/javascript application/wasm image/svg+xml audio/wav;

    # Internal Gateway Protection
    location /__gw/ {
        access_log off;
        return 404;
    }

    # ─── Optimized Static Build Assets (_next/static) ────────────
    location ^~ /_next/static/ {
        alias /home/ubuntu/apps/libertypie/gaia-frontier-after-contact/.next/static/;

        sendfile on;
        tcp_nopush on;

        open_file_cache max=2000 inactive=120s;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 2;
        open_file_cache_errors off;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Asset-Cache "HIT-DISK" always;

        # Repeat inherited headers for location-level override fix
        add_header Content-Security-Policy "frame-ancestors *;" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        brotli_static on;
        gzip_static on;
        access_log off;
        log_not_found off;
    }

    # ─── Public Static Game Files & Assets (Disk-First) ─────────
    # Covers WebAssembly (.wasm), Unity/Godot assets, and Audio formats
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|avif|woff2?|ttf|eot|wasm|data|unityweb|pck|mp3|ogg|wav)$ {
        root /home/ubuntu/apps/libertypie/gaia-frontier-after-contact/public;
        try_files $uri @app;

        sendfile on;
        tcp_nopush on;

        add_header Cache-Control "public, max-age=2592000, must-revalidate" always;

        # Repeat inherited headers for location-level override fix
        add_header Content-Security-Policy "frame-ancestors *;" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        access_log off;
        log_not_found off;
    }

    # ─── App Proxy Fallback Block ────────────────────────────────
    location @app {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;

        # WebSocket pass-through support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_socket_keepalive on;

        add_header Cache-Control $html_cache_control always;
        add_header Content-Security-Policy "frame-ancestors *;" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    # ─── Next.js Main Catch-All ──────────────────────────────────
    location / {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;

        # WebSocket pass-through support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_socket_keepalive on;

        add_header Cache-Control $html_cache_control always;
        add_header Content-Security-Policy "frame-ancestors *;" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }
}
